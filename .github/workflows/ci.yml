name: PowerAutomate.Desktop.Modules-CI

on:
  push:
    branches:
      - main

env:
  CONFIGURATION: "Release"
  ENVIRONMENT: "Production"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      if: ${{ success() }}
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      if: ${{ success() }}
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Restore solution
      if: ${{ success() }}
      run: msbuild PowerAutomate.Desktop.slnx -target:restore -property:Configuration=${{ env.CONFIGURATION }} -property:Environment=${{ env.ENVIRONMENT }}

    - name: Build solution
      if: ${{ success() }}
      run: msbuild PowerAutomate.Desktop.slnx -target:rebuild -property:Configuration=${{ env.CONFIGURATION }} -property:Environment=${{ env.ENVIRONMENT }}

    - name: Run unit tests and enforce coverage
      if: ${{ success() }}
      run: powershell -ExecutionPolicy Bypass -File .tools/test-coverage.ps1 -Configuration ${{ env.CONFIGURATION }}

    - name: Publish coverage
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ github.workflow }}
        path: artifacts/coverage/**/coverage.cobertura.xml
        if-no-files-found: ignore
